name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AcxiomCRM.sln

      - name: Build
        run: dotnet build AcxiomCRM.sln -c Release --no-restore

      - name: Test
        run: dotnet test AcxiomCRM.sln -c Release --no-build --verbosity normal

      - name: Docker image builds
        run: docker build -t acxiomcrm:ci .
